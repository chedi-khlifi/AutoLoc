spring.application.name=autoloc-api

# Préfixe commun de l'API (Atelier 5)
server.servlet.context-path=/api
server.port=8081

# MySQL (XAMPP : utilisateur root sans mot de passe par défaut).
# Si MySQL tourne sur le port 3307, remplacez 3306 par 3307.
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Palliatif provisoire (supprimé avec les DTO, Chapitre 10)
spring.jackson.serialization.fail-on-empty-beans=false
